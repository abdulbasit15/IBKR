<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Journal</title>
<style>
:root{
  --bg:#0a0d16; --panel:#131826; --panel2:#0f1421; --card:#161c2c;
  --line:#232a3d; --txt:#e7eaf3; --muted:#8b93a7; --muted2:#5b6478;
  --accent:#7c5cff; --accent2:#9d86ff; --green:#22c55e; --red:#ef4444;
  --blue:#3b82f6; --amber:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px}
a{color:inherit;text-decoration:none}
#app{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:220px;flex:0 0 220px;background:var(--panel2);border-right:1px solid var(--line);
  padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;
  letter-spacing:.5px;padding:6px 8px 18px}
.brand .dot{width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}
.addbtn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:10px;padding:10px;font-weight:600;cursor:pointer;
  margin-bottom:14px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;
  color:var(--muted);font-weight:500;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:var(--card);color:var(--txt)}
.nav a.active{background:var(--card);color:#fff}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.nav .tag{margin-left:auto;font-size:9px;background:var(--accent);color:#fff;
  padding:1px 5px;border-radius:5px}
/* Main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 24px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,13,22,.85);
  backdrop-filter:blur(8px);z-index:5}
.topbar h1{font-size:20px;margin:0;font-weight:700}
.topbar .spacer{flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:7px 12px;color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center}
.content{padding:22px 24px 60px}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
@media(max-width:1200px){.cards{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.card .lbl{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.card .big{font-size:26px;font-weight:800;margin-top:8px}
.card .sub{color:var(--muted);font-size:12px;margin-top:4px}
.pos{color:var(--green)} .neg{color:var(--red)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:1fr 2fr 2fr}
.g2{grid-template-columns:1fr 1fr}
.g2b{grid-template-columns:1.3fr 1fr}
@media(max-width:1100px){.g3,.g2,.g2b{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{margin:0 0 12px;font-size:14px;font-weight:600;color:#dfe3ee;
  display:flex;align-items:center;gap:8px}
.panel h3 .muted{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:200px}
.chartbox.lg{height:320px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.scorebig{font-size:34px;font-weight:800}
/* Tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.03em;cursor:pointer;user-select:none}
tbody tr:hover{background:var(--panel2)}
.badge{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.b-long{background:rgba(34,197,94,.15);color:#4ade80}
.b-short{background:rgba(239,68,68,.15);color:#f87171}
.b-win{background:rgba(34,197,94,.15);color:#4ade80}
.b-loss{background:rgba(239,68,68,.15);color:#f87171}
.tablewrap{overflow:auto;border-radius:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
select,input{background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:7px 10px;font-size:13px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr) 120px;gap:6px}
.cal .dow{color:var(--muted);font-size:11px;text-transform:uppercase;text-align:center;padding:4px}
.cal .cell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  min-height:74px;padding:6px 7px;font-size:11px;position:relative}
.cal .cell.win{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35)}
.cal .cell.loss{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}
.cal .cell .dn{color:var(--muted);position:absolute;top:5px;right:7px}
.cal .cell .pl{font-weight:700;margin-top:16px}
.cal .cell .tr{color:var(--muted)}
.cal .cell .evdots{position:absolute;top:5px;left:6px;display:flex;gap:3px}
.cal .cell .evdots i{width:6px;height:6px;border-radius:50%;display:block}
.cal .cell .evlist{margin-top:3px;display:flex;flex-direction:column;gap:1px}
.cal .cell .evlist span{font-size:9px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-hi{background:#ef4444} .ev-md{background:#f59e0b}
.cal-legend{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12px;margin-top:10px}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}
.cal .week{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:6px 8px;font-size:11px;display:flex;flex-direction:column;justify-content:center}
.calhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.calhead button{background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:8px;padding:5px 11px;cursor:pointer}
/* Flags & misc */
.flag{display:flex;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:9px 12px;margin-bottom:8px}
.flag .t{font-weight:600;min-width:190px}
.flag .d{color:var(--muted)}
.ai h2{color:var(--accent2);font-size:17px;margin:18px 0 6px}
.ai h3{color:var(--accent2);font-size:14px;margin:16px 0 5px}
.ai p{margin:7px 0;color:#d3d8e6} .ai li{margin:4px 0;color:#d3d8e6}
.ai strong{color:#fff}
.empty{color:var(--muted);text-align:center;padding:40px}
.progress-bar{height:8px;background:var(--panel2);border-radius:6px;overflow:hidden;margin-top:6px}
.progress-bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.pbcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px}
.chip.auto{border-color:rgba(124,92,255,.5);color:var(--accent2)}
tbody tr.clickable{cursor:pointer}
/* Trade detail overlay */
.overlay{position:fixed;inset:0;background:rgba(4,6,12,.72);z-index:50;
  display:none;align-items:flex-start;justify-content:center;padding:28px;overflow:auto}
.overlay.show{display:flex}
.tdetail{background:var(--panel);border:1px solid var(--line);border-radius:16px;
  width:min(1100px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.tdhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.tdhead h2{margin:0;font-size:18px}
.tdhead .side{font-weight:700}
.tdhead .close{margin-left:auto;background:var(--card);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer}
.tdbody{display:grid;grid-template-columns:240px 1fr;gap:0}
@media(max-width:820px){.tdbody{grid-template-columns:1fr}}
.tdstats{padding:16px 18px;border-right:1px solid var(--line)}
.tdstats .netpl{font-size:26px;font-weight:800;margin-bottom:12px}
.tdstats .row{display:flex;justify-content:space-between;padding:6px 0;
  border-bottom:1px solid var(--panel2);font-size:13px}
.tdstats .row .k{color:var(--muted)}
.tdchart{padding:16px 18px}
.tdchart .cwrap{position:relative;height:430px}
.tdchart .cwrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.indbox{margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.indbox .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
.indrow{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding:3px 0;color:#cbd5e1}
.indrow .il{color:var(--muted);min-width:34px;font-weight:600}
.indrow .up,.up{color:var(--green)} .indrow .dn,.dn{color:var(--red)}
.ind5m,.volbox,.pbbox{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
.ind5m .k,.volbox .k,.pbbox .k{margin-bottom:5px}
.pbgrade{display:inline-block;font-size:12px;padding:3px 10px;border-radius:7px;margin-bottom:6px;border:1px solid var(--line)}
.pbgrade b{font-size:13px}
.pbgrade.g3{color:#4ade80;border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.12)}
.pbgrade.g2{color:#a3e635;border-color:rgba(132,204,22,.4);background:rgba(132,204,22,.10)}
.pbgrade.g1{color:#fbbf24;border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.10)}
.pbgrade.g0{color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.10)}
.pbchecks{display:flex;gap:6px 10px;flex-wrap:wrap;margin-bottom:4px}
.pbchk{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.pbchk.ok{color:#4ade80;border-color:rgba(34,197,94,.35)}
.pbchk.no{color:#f87171;border-color:rgba(239,68,68,.35)}
.pbchk .mono{color:var(--muted)}
.inddet{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:#cbd5e1;padding:2px 0}
.inddet .dl{min-width:78px;color:var(--muted);font-weight:600;font-size:11px}
.inddet .mono{color:#9aa5b1;font-size:11px}
.inddet .up,.inddet .dn{font-weight:600}
.indlegend{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.indlegend b{color:#cbd5e1;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
.indlegend .up,.indlegend .dn{font-weight:600}
.ibadges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ibadge{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--line)}
.ibadge.ok{color:#4ade80;border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
.ibadge.no{color:#f87171;border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
.indai{margin-top:12px;background:linear-gradient(180deg,rgba(124,92,255,.08),var(--panel2));border:1px solid rgba(124,92,255,.35);border-radius:10px;padding:10px 12px}
.indai .k{color:#b9a7ff;font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.aisec{margin-top:10px}
.aisec:first-of-type{margin-top:2px}
.aihdr{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#b9a7ff;margin-bottom:3px;border-bottom:1px solid rgba(124,92,255,.2);padding-bottom:2px}
.aisec.play{background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.4);border-radius:8px;padding:7px 10px;margin-top:12px}
.aisec.play .aihdr{border-bottom:none;color:#c9bcff;margin-bottom:2px}
.indai-body li.sub{list-style:none;margin-left:-18px;color:#9aa5b1;font-size:11.5px}
.indai-body{font-size:12.5px;line-height:1.55;color:#dbe2ea;margin:0;padding-left:18px;list-style:disc}
.indai-body li{margin:4px 0}
.indai-body li::marker{color:#7c5cff}
.indai-body li.play{list-style:none;margin:9px 0 5px -18px;padding:8px 11px;border-radius:8px;
  background:rgba(124,92,255,.14);border:1px solid rgba(124,92,255,.4);line-height:1.5}
.indai-body li.hist{list-style:none;margin-left:-18px;padding:2px 11px 0 29px;color:#aeb6c2;font-size:12px}
.indai-body strong{color:#fff} .indai-body em{color:#9aa5b1;font-style:normal}
.tvshot{margin-top:14px}
.tvshot .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em;margin:6px 0}
.tvshot img{width:100%;border:1px solid var(--line);border-radius:10px;display:block;cursor:zoom-in}
.tagedit{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.tagedit label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.03em;margin:8px 0 3px}
.tagedit input{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:7px 10px;font-size:13px}
.tagedit button{margin-top:10px;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:8px;padding:9px;font-weight:600;cursor:pointer}
.tagedit .hint{color:var(--muted);font-size:11px;margin-top:6px;text-align:center}
.quickpick{margin-top:12px}
.qp{margin-bottom:8px}
.qpk{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.chip.qpc{cursor:pointer;font-size:11px;padding:3px 9px;user-select:none}
.chip.qpc:hover{border-color:var(--accent);color:var(--accent2)}
/* Rules checklist */
.rule{display:flex;gap:11px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:8px;background:var(--panel2)}
.rule.hard{border-left:3px solid var(--red)}
.rule.other{border-left:3px solid var(--amber)}
.rule input[type=checkbox]{margin-top:2px;width:17px;height:17px;accent-color:var(--accent);flex:0 0 auto;cursor:pointer}
.rule .rtext{flex:1;line-height:1.5}
.rule.done .rtext{color:var(--muted);text-decoration:line-through}
.rule .del{color:var(--muted2);cursor:pointer;flex:0 0 auto;font-size:14px;padding:0 2px}
.rule .del:hover{color:var(--red)}
.rules-add{display:flex;gap:8px;margin-top:12px}
.rules-add input{flex:1}
.rules-add button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600}
.rules-hdr{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.rules-hdr h2{margin:0;font-size:16px}
.rules-hdr .cnt{color:var(--muted);font-size:12px;margin-left:auto}
.tagview{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.tagview .k{color:var(--muted);font-size:11px;text-transform:uppercase}
.tagview .chips{margin:4px 0 8px}
.chip.mis{border-color:rgba(239,68,68,.5);color:#f87171}
.tdlegend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.tdlegend b{color:var(--txt)}
.dotm{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* Heatmap */
.hm-legend{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-left:auto}
.hm-swatch{width:16px;height:12px;border-radius:3px;display:inline-block}
.mono{color:var(--muted);font-size:12px}
/* News / calendar filters */
.newsgrid{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.newsgrid{grid-template-columns:1fr}}
.fpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.fpanel h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.fpanel .grp{margin-bottom:16px}
.fopt{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer}
.fopt input{width:15px;height:15px;accent-color:var(--accent)}
.imp-dot{display:inline-flex;align-items:center;gap:7px}
.flink{color:var(--accent2);font-size:11px;cursor:pointer;margin-left:6px}
.news-date{background:var(--panel2);font-weight:700;color:#cbd5e1}
.news-note{color:var(--muted);font-size:12px;margin:0 0 12px;background:rgba(124,92,255,.08);
  border:1px solid rgba(124,92,255,.25);border-radius:8px;padding:8px 12px}
.imp-high{color:#ef4444} .imp-med{color:#f59e0b} .imp-low{color:#eab308}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot"></span> ZELLA<span style="color:var(--accent2)">.local</span></div>
    <button class="addbtn" onclick="alert('Add trades by importing your Tradovate CSV:\n\npython -m journal import --csv Orders.csv')">+ Add Trade</button>
    <nav class="nav" id="nav">
      <a data-route="dashboard" class="active"><span class="ic">▚</span> Dashboard</a>
      <a data-route="journal"><span class="ic">▤</span> Daily Journal</a>
      <a data-route="calendar"><span class="ic">▦</span> Calendar</a>
      <a data-route="news"><span class="ic">📰</span> News <span class="tag">LIVE</span></a>
      <a data-route="trades"><span class="ic">≡</span> Trades</a>
      <a data-route="rules"><span class="ic">☑</span> Rules</a>
      <a data-route="notebook"><span class="ic">✎</span> AI Analysis &amp; Coaching</a>
      <a data-route="reports"><span class="ic">▦</span> Reports</a>
      <a data-route="playbooks"><span class="ic">▶</span> Playbooks</a>
      <a data-route="progress"><span class="ic">✦</span> Progress <span class="tag">NEW</span></a>
    </nav>
  </aside>
  <main>
    <header class="topbar">
      <h1 id="title">Dashboard</h1>
      <div class="spacer"></div>
      <span class="pill" id="rangepill">📅 —</span>
      <span class="pill">$ USD</span>
      <span class="pill">All accounts ▾</span>
    </header>
    <div class="content" id="screen"></div>
  </main>
  <div class="overlay" id="tradeOverlay" onclick="if(event.target===this)closeTrade()">
    <div class="tdetail" id="tdetail"></div>
  </div>
</div>

<script>/*__CHARTJS__*/</script>
<script>
const DATA = /*__DATA__*/;
const SERVER = /*__SERVER__*/;   // true when running via `python -m journal serve`
const S = DATA.summary, Z = DATA.zella;
const $ = (s,e=document)=>e.querySelector(s);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
const money = v => (v==null?'—':(v<0?'-':'')+'$'+Math.abs(+v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
const money0 = v => (v==null?'—':(v<0?'-':'')+'$'+Math.abs(+v).toLocaleString(undefined,{maximumFractionDigits:0}));
const pct = v => (v*100).toFixed(1)+'%';
const px = v => (v==null||v==='')?'—':(+v).toFixed(2);   // price to 2 decimals
function tvImg(u){                                        // TradingView share link -> image
  if(!u) return '';
  const m=(''+u).match(/tradingview\.com\/x\/([A-Za-z0-9]+)/);
  if(m) return `https://s3.tradingview.com/snapshots/${m[1][0].toLowerCase()}/${m[1]}.png`;
  return u;   // assume it's already a direct image URL
}
const cls = v => (+v>0?'pos':(+v<0?'neg':''));
let CHARTS=[];
function clearCharts(){CHARTS.forEach(c=>{try{c.destroy()}catch(e){}});CHARTS=[];}

if(window.Chart){
  Chart.defaults.color='#8b93a7';
  Chart.defaults.borderColor='#232a3d';
  Chart.defaults.font.family='Segoe UI, system-ui, sans-serif';
  Chart.defaults.plugins.legend.display=false;
  Chart.defaults.maintainAspectRatio=false;
}
const GREEN='#22c55e',RED='#ef4444',ACC='#7c5cff';
const grad=(ctx,color)=>{const g=ctx.createLinearGradient(0,0,0,260);
  g.addColorStop(0,color+'55');g.addColorStop(1,color+'00');return g;};

/* ---------- Reusable card ---------- */
function card(label,big,sub,extra=''){
  return `<div class="card"><div class="lbl">${label}</div>
    <div class="big ${extra}">${big}</div><div class="sub">${sub||''}</div></div>`;
}

/* ================= DASHBOARD ================= */
function screenDashboard(){

/* ---------- Calendar (shared by Dashboard + Calendar heatmap) ---------- */
let calMonth=null;
const CAL_MAXABS=Math.max(1,...DATA.daily.map(d=>Math.abs(d.pnl)));
function heatStyle(pnl){
  const i=Math.min(1,Math.abs(pnl)/CAL_MAXABS);
  const a=(0.12+i*0.55).toFixed(2);
  const c=pnl>=0?`34,197,94`:`239,68,68`;
  return `background:rgba(${c},${a});border-color:rgba(${c},${Math.min(1,i+0.3)})`;
}
function buildCalendar(mountSel,heat){
  const byDate={}; DATA.daily.forEach(d=>byDate[d.date]=d);
  const months=[...new Set(DATA.daily.map(d=>d.date.slice(0,7)))].sort();
  if(!calMonth||!months.includes(calMonth)) calMonth=months[months.length-1];
  const wrap=el('<div></div>');
  const [y,m]=calMonth.split('-').map(Number);
  const monName=new Date(y,m-1,1).toLocaleString('en',{month:'long',year:'numeric'});
  const idx=months.indexOf(calMonth);
  const mp=DATA.daily.filter(d=>d.date.slice(0,7)===calMonth).reduce((s,d)=>s+d.pnl,0);
  const head=el(`<div class="calhead">
    <button ${idx<=0?'disabled':''} id="pm">‹</button>
    <strong>${monName}</strong>
    <button ${idx>=months.length-1?'disabled':''} id="nm">›</button>
    <span class="mono">Month: <b class="${cls(mp)}">${money0(mp)}</b></span></div>`);
  wrap.appendChild(head);
  const grid=el('<div class="cal"></div>');
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>grid.appendChild(el(`<div class="dow">${d}</div>`)));
  grid.appendChild(el(`<div class="dow">Week</div>`));
  const start=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let day=1, weekPL=0, weekDays=0, cellInWeek=0, cells=[];
  for(let i=0;i<start;i++){cells.push('<div></div>');cellInWeek++;}
  const flushWeek=()=>{
    grid.insertAdjacentHTML('beforeend', cells.join(''));
    grid.appendChild(el(`<div class="week"><div class="${cls(weekPL)}">${weekDays?money0(weekPL):'$0'}</div>
      <div class="tr">${weekDays} day${weekDays===1?'':'s'}</div></div>`));
    cells=[];weekPL=0;weekDays=0;cellInWeek=0;
  };
  while(day<=days){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const d=byDate[ds];
    if(d){weekPL+=d.pnl;weekDays++;}
    const c=(!heat&&d)?(d.pnl>=0?'win':'loss'):'';
    const st=(heat&&d)?` style="${heatStyle(d.pnl)}"`:'';
    const evs=(DATA.events_by_day||{})[ds]||[];
    const dots=evs.length?`<span class="evdots">${evs.slice(0,4).map(e=>
      `<i class="${e.impact==='High'?'ev-hi':'ev-md'}"></i>`).join('')}</span>`:'';
    const title=evs.length?` title="${evs.map(e=>`${e.time} ${e.label} (${e.impact})`).join('&#10;')}"`:'';
    const evlist=(heat&&evs.length)?`<div class="evlist">${evs.slice(0,2).map(e=>
      `<span class="${e.impact==='High'?'imp-high':'imp-med'}">• ${e.label}</span>`).join('')}</div>`:'';
    cells.push(`<div class="cell ${c}"${st}${title}><span class="dn">${day}</span>${dots}
      ${d?`<div class="pl ${cls(d.pnl)}">${money0(d.pnl)}</div><div class="tr">${d.n} trade${d.n===1?'':'s'}</div>`:''}${evlist}</div>`);
    cellInWeek++;
    if(cellInWeek===7) flushWeek();
    day++;
  }
  if(cellInWeek>0){while(cellInWeek<7){cells.push('<div></div>');cellInWeek++;}flushWeek();}
  wrap.appendChild(grid);
  wrap.appendChild(el(`<div class="cal-legend">
    <span><i class="ev-hi"></i>High-impact news</span>
    <span><i class="ev-md"></i>Medium-impact news</span>
    <span class="mono">hover a day to see events</span></div>`));
  head.querySelector('#pm').onclick=()=>{calMonth=months[idx-1];renderCalInto(mountSel,heat);};
  head.querySelector('#nm').onclick=()=>{calMonth=months[idx+1];renderCalInto(mountSel,heat);};
  return wrap;
}
function renderCalInto(sel,heat){const m=$(sel);if(m){m.innerHTML='';m.appendChild(buildCalendar(sel,heat));}}

/* ---------- Trade detail (candlestick + entry/exit) ---------- */
const ETO=-4; // display candle times in US Eastern
function tradeBars(t){
  const all=DATA.intraday[t.asset+'|'+t.date]||[];
  if(!all.length) return null;
  let eIdx=0,best=1e18;
  all.forEach((b,i)=>{const d=Math.abs(b[0]-t.entry_ep);if(d<best){best=d;eIdx=i;}});
  let xIdx=-1;
  if(t.exit!=null) for(let i=eIdx;i<all.length;i++){if(all[i][3]<=t.exit&&t.exit<=all[i][2]){xIdx=i;break;}}
  if(xIdx<0) xIdx=Math.min(all.length-1,eIdx+10);
  const BEFORE=24, AFTER=12;   // 2h before entry, 1h after exit (5-min bars)
  const lo=Math.max(0,eIdx-BEFORE),hi=Math.min(all.length,Math.max(xIdx,eIdx)+AFTER);
  return {bars:all.slice(lo,hi),eIdx:eIdx-lo,xIdx:xIdx-lo};
}
function drawCandles(canvas,tb,t){
  const dpr=window.devicePixelRatio||1, W=canvas.clientWidth||800, H=canvas.clientHeight||420;
  canvas.width=W*dpr;canvas.height=H*dpr;
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const bars=tb.bars;
  const padL=58,padR=16,padT=14,padB=26,plotW=W-padL-padR,plotH=H-padT-padB;
  let mn=Infinity,mx=-Infinity;
  bars.forEach(b=>{mn=Math.min(mn,b[3]);mx=Math.max(mx,b[2]);});
  [t.entry,t.exit,t.stop,t.target].forEach(v=>{if(v!=null){mn=Math.min(mn,v);mx=Math.max(mx,v);}});
  const p=(mx-mn)*0.08||1;mn-=p;mx+=p;
  const y=v=>padT+plotH-((v-mn)/(mx-mn))*plotH;
  const n=bars.length,step=plotW/n,cw=Math.max(2,step*0.6);
  ctx.strokeStyle='#1b2233';ctx.fillStyle='#8b93a7';ctx.font='11px Segoe UI';ctx.textBaseline='middle';
  for(let g=0;g<=4;g++){const val=mn+(mx-mn)*g/4,yy=y(val);
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();
    ctx.fillText(val.toFixed(1),6,yy);}
  ctx.textBaseline='alphabetic';ctx.fillStyle='#5b6478';
  const lab=i=>{const d=new Date(bars[i][0]*1000),h=(d.getUTCHours()+ETO+24)%24;
    return String(h).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');};
  const stepLbl=Math.max(1,Math.ceil(n/6));
  for(let i=0;i<n;i+=stepLbl) ctx.fillText(lab(i),padL+i*step,H-8);
  bars.forEach((b,i)=>{const cx=padL+i*step+step/2,up=b[4]>=b[1];
    ctx.strokeStyle=up?'#22c55e':'#ef4444';ctx.fillStyle=up?'#22c55e':'#ef4444';
    ctx.beginPath();ctx.moveTo(cx,y(b[2]));ctx.lineTo(cx,y(b[3]));ctx.stroke();
    const o=y(b[1]),c=y(b[4]);ctx.fillRect(cx-cw/2,Math.min(o,c),cw,Math.max(1,Math.abs(o-c)));});
  const hline=(v,color,label,dash)=>{if(v==null)return;const yy=y(v);
    ctx.save();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=1.2;
    ctx.beginPath();ctx.moveTo(padL,yy);ctx.lineTo(W-padR,yy);ctx.stroke();ctx.restore();
    ctx.fillStyle=color;ctx.font='10px Segoe UI';ctx.textBaseline='alphabetic';
    ctx.fillText(label+' '+(+v).toFixed(2),padL+4,yy-3);};
  hline(t.stop,'#ef4444','SL',[2,3]);
  hline(t.target,'#22c55e','TP',[2,3]);
  hline(t.entry,'#93a0ff','Entry',[5,4]);
  const marker=(idx,price,color,label)=>{if(idx<0||idx>=n||price==null)return;
    const cx=padL+idx*step+step/2,cy=y(price);
    ctx.beginPath();ctx.arc(cx,cy,5.5,0,7);ctx.fillStyle=color;ctx.fill();
    ctx.strokeStyle='#0a0d16';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle=color;ctx.font='bold 10px Segoe UI';ctx.fillText(label,cx+8,cy-6);};
  marker(tb.eIdx,t.entry,'#7c5cff','ENTRY');
  marker(tb.xIdx,t.exit,(t.pnl>=0?'#22c55e':'#ef4444'),'EXIT');
}

function esc(s){return (''+(s||'')).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function chipsHtml(str,cls){

function tagCats(){
  const fields=DATA.tag_fields||{};
  return Object.keys(DATA.tag_vocab||{}).map(cat=>({
    cat, field:fields[cat]||'setup', id:'tg_'+(fields[cat]||'setup')}));
}
function inputSel(field){return '#tg_'+field;}
function tagSection(t,id){
  const cats=tagCats();
  if(SERVER){
    const inputs=cats.map(c=>`
      <label>${c.cat}${c.field==='setup'&&t.setup_auto?' · auto ✦':''}</label>
      <input id="${c.id}" value="${esc(t[c.field])}" placeholder="click chips below or type…">`).join('');
    return `<div class="tagedit">
      ${inputs}
      <label>TradingView screenshot URL</label>
      <input id="tgShot" value="${esc(t.chart)}" placeholder="https://www.tradingview.com/x/AbC123/">
      <button id="tgSave" onclick="saveTags(${id})">Save tags</button>
      <div class="hint">comma-separated · saves to your Excel workbook</div>
      <div class="quickpick"><div class="hint" style="text-align:left">Quick add:</div>
        ${tagChips()}</div></div>`;
  }
  return `<div class="tagview">
    ${cats.map(c=>`<div class="k">${c.cat}</div>${chipsHtml(t[c.field], c.field==='mistakes'?'mis':'')}`).join('')}
    <div class="mono" style="margin-top:6px">Run <code>python -m journal serve</code> to edit tags here.</div></div>`;

function tagChips(){
  const vocab=DATA.tag_vocab||{}, fields=DATA.tag_fields||{};
  return Object.entries(vocab).map(([cat,list])=>{
    const field=fields[cat]||'setup';
    return `<div class="qp"><div class="qpk">${cat}</div><div class="chips">${
      list.map(tg=>`<span class="chip qpc" onclick="addTag('${field}',this.textContent)">${tg}</span>`).join('')
    }</div></div>`;
  }).join('');
}
function addTag(field,tag){
  const inp=$(inputSel(field)); if(!inp) return;
  const cur=inp.value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!cur.some(x=>x.toLowerCase()===tag.toLowerCase())) cur.push(tag);
  inp.value=cur.join(', ');
}
function saveTags(id){
  const t=DATA.trades[id];
  const body={date:t.date,time:t.time,asset:t.asset,direction:t.direction,entry:t.entry,
    screenshot:(($('#tgShot')||{}).value||'').trim()};
  tagCats().forEach(c=>{ body[c.field]=(($(inputSel(c.field))||{}).value||'').trim(); });
  const btn=$('#tgSave');btn.textContent='Saving…';btn.disabled=true;
  fetch('/api/save-tags',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)})
    .then(r=>r.json()).then(res=>{
      btn.disabled=false;
      if(res.ok){
        tagCats().forEach(c=>{t[c.field]=body[c.field];});
        t.chart=body.screenshot;t.setup_auto=false;
        btn.textContent='✓ Saved to Excel';
        const sc=$('#tdShot'); if(sc) sc.innerHTML=shotHtml(t);
        refreshScreen();   // live-update the table/aggregates behind the popup
        setTimeout(()=>btn.textContent='Save tags',1600);}
      else{btn.textContent='Save tags';alert('Save failed: '+(res.error||'unknown'));}
    }).catch(e=>{btn.disabled=false;btn.textContent='Save tags';alert('Save failed: '+e);});
}

function indHtml(t){
  const s=t.ind; if(!s) return '';
  const ar=d=>d==='up'?'<span class="up">▲ up</span>':d==='down'?'<span class="dn">▼ down</span>':'– flat';
  const row=(lbl,o,extra)=>o?`<div class="indrow"><span class="il">${lbl}</span>
    <span>ST ${ar(o.st)}</span><span>RSI ${o.rsi??'–'}</span>${extra?extra(o):''}</div>`:'';
  const badge=(ok,txt)=>`<span class="ibadge ${ok?'ok':'no'}">${ok?'✓':'✗'} ${txt}</span>`;
  const trendLegend=`<div class="indlegend" title="1H trend rule">
    <b>1H trend</b>
    <span><span class="up">▲ up</span> close &gt; EMA50 &amp; EMA21 &gt; EMA50</span>
    <span><span class="dn">▼ down</span> close &lt; EMA50 &amp; EMA21 &lt; EMA50</span>
    <span>– flat mixed / choppy</span></div>`;
  // crossover freshness: how long ago the EMA/MACD lines crossed (bars → minutes on 5m)
  const crossTag=(bars,bull,tf=5)=>{
    if(bars==null) return '';
    const a=bull?'<span class="up">↑</span>':'<span class="dn">↓</span>';
    if(bars===0) return ` · <b>just crossed ${a}</b>`;
    if(bars<=6) return ` · crossed ${a} ${bars} bar${bars>1?'s':''} ago (${bars*tf}m)`;
    return ` · last cross ${a} ${bars*tf}m ago`;
  };
  const emaDetail=o=>{
    if(!o||o.ema9==null) return '';
    const bull=o.emacross==='bull';
    const st=bull?'<span class="up">▲ bullish (9 &gt; 21)</span>':'<span class="dn">▼ bearish (9 &lt; 21)</span>';
    return `<div class="inddet"><span class="dl">EMA 9/21</span>${st}
      <span class="mono">9: ${px(o.ema9)} · 21: ${px(o.ema21)} · gap ${o.ema_gap>0?'+':''}${o.ema_gap}</span>
      ${crossTag(o.ema_cross_bars,bull)}</div>`;
  };
  const macdDetail=o=>{
    if(!o||o.macd_hist==null) return '';
    const bull=o.macd_state==='bullish';
    const st=bull?'<span class="up">▲ bullish</span>':'<span class="dn">▼ bearish</span>';
    const mom=o.macd_mom==='rising'?'<span class="up">rising ↗</span>':'<span class="dn">falling ↘</span>';
    return `<div class="inddet"><span class="dl">MACD 12/26/9</span>${st}
      <span class="mono">line ${o.macd_line} vs signal ${o.macd_signal} · hist ${o.macd_hist>0?'+':''}${o.macd_hist} ${mom}</span>
      ${crossTag(o.macd_cross_bars,bull)}</div>`;
  };
  const lvlBox=(kl,eb)=>{
    if(!kl&&!eb) return '';
    let rows='';
    if(kl){
      const near=kl.at_level?`<span class="up">${esc(kl.near.join(', '))}</span>`:'<span class="mono">not at a level</span>';
      const all=Object.entries(kl.levels||{}).map(([k,v])=>`${k} ${px(v)}`).join(' · ');
      rows+=`<div class="inddet"><span class="dl">At level</span>${near}</div>
        <div class="inddet"><span class="dl">Levels</span><span class="mono">${esc(all)}</span></div>`;
    }
    if(eb&&eb.candle_type){
      const cc=eb.candle_ok?'up':eb.candle_against?'dn':'';
      rows+=`<div class="inddet"><span class="dl">Candle</span><span class="${cc}">${esc(eb.candle_type)}</span> <span class="mono">${eb.candle_ok?'(with trade)':eb.candle_against?'(against)':''}</span></div>`;
    }
    if(eb&&eb.trigvol!=null){
      rows+=`<div class="inddet"><span class="dl">Trigger vol</span><span class="${eb.trigvol_ok?'up':''}">${eb.trigvol}×</span> <span class="mono">${eb.trigvol_ok?'(conviction)':'(weak)'}</span></div>`;
    }
    return `<div class="volbox"><div class="k">Key levels &amp; trigger</div>${rows}</div>`;
  };
  const rowAdx=(lbl,o,extra)=>o?`<div class="indrow"><span class="il">${lbl}</span>
    <span>ST ${ar(o.st)}</span><span>RSI ${o.rsi??'–'}</span>${o.adx!=null?`<span>ADX ${o.adx}</span>`:''}${extra?extra(o):''}</div>`:'';
  const dirWord=t.direction==='Long'?'Long':'Short';
  const sgn=v=>v>0?'+'+v:''+v;
  const volDet=(dl,body)=>`<div class="inddet"><span class="dl">${dl}</span>${body}</div>`;
  const volBox=se=>{
    if(!se) return '';
    const m5=s.m5||{};
    const vwapSide=se.vwap_side==='above'?'<span class="up">above ▲</span>':'<span class="dn">below ▼</span>';
    const deltaCls=se.est_delta>0?'up':'dn';
    const rvolTxt=se.rvol!=null?`${se.rvol}× <span class="mono">(${se.rvol>=1.5?'high':se.rvol<0.7?'thin':'normal'} vol)</span>`:'–';
    const adxTxt=m5.adx!=null?`${m5.adx} <span class="mono">(${m5.adx_regime})</span>`:'–';
    return `<div class="volbox"><div class="k">Volume &amp; volatility (5-min · session-anchored)</div>
      ${volDet('VWAP',`${px(se.vwap)} — price ${vwapSide} <span class="mono">by ${px(Math.abs(se.vwap_dist))}</span>`)}
      ${volDet('VPOC',`${px(se.vpoc)} <span class="mono">(${sgn(se.vpoc_dist)} from entry — volume magnet)</span>`)}
      ${volDet('RVOL',rvolTxt)}
      ${volDet('ADX (14)',adxTxt)}
      ${m5.atr!=null?volDet('ATR (14)',`${m5.atr} <span class="mono">pts — typical 5m range</span>`):''}
      ${volDet('Est. delta',`<span class="${deltaCls}">${sgn(se.est_delta)}</span> <span class="mono">(${se.est_delta_side} — proxy, not tick data)</span>`)}
    </div>`;
  };
  const chk=(ok,label,detail)=>`<span class="pbchk ${ok?'ok':'no'}">${ok?'✓':'✗'} ${label}${detail?` <span class="mono">${detail}</span>`:''}</span>`;
  const pbBox=(pb,fib)=>{
    if(!pb&&!fib) return '';
    const gradeCls=pb?['g0','g1','g2','g3'][pb.score]:'';
    const golden=fib&&fib.in_golden;
    const fibRow=fib?`<div class="inddet"><span class="dl">Fib leg</span>
      <span class="mono">${px(fib.leg_low)} → ${px(fib.leg_high)}</span></div>
      <div class="inddet"><span class="dl">Levels</span>
      <span class="mono">38.2% ${px(fib.f382)} · 50% ${px(fib.f50)} · 61.8% ${px(fib.f618)} · 78.6% ${px(fib.f786)}</span></div>
      <div class="inddet"><span class="dl">Entry</span>
      <span class="${golden?'up':''}">${Math.round(fib.retr*100)}% retrace — ${golden?'<b>golden zone</b>':esc(fib.zone)}</span></div>`:'';
    const pbRow=pb?`<div class="pbgrade ${gradeCls}">Pullback entry: <b>${pb.grade}</b> (${pb.score}/3)</div>
      <div class="pbchecks">${chk(pb.trend_ok,'Trend')}${chk(pb.zone_ok,'Zone',pb.zones&&pb.zones.length?pb.zones.join(', '):'')}${chk(pb.trigger_ok,'Trigger',pb.triggers&&pb.triggers.length?pb.triggers.join(', '):'')}</div>`:'';
    return `<div class="pbbox"><div class="k">Pullback entry &amp; Fibonacci</div>${pbRow}${fibRow}</div>`;
  };
  return `<div class="indbox"><div class="k">Indicators at entry (1H / 15m / 5m)</div>
    ${rowAdx('1H',s.h1,o=>`<span>Trend ${ar(o.trend)}</span>`)}
    ${rowAdx('15m',s.m15)}
    ${rowAdx('5m',s.m5)}
    ${s.h1?trendLegend:''}
    ${s.m5?`<div class="ind5m"><div class="k">5-min triggers</div>${emaDetail(s.m5)}${macdDetail(s.m5)}</div>`:''}
    ${volBox(s.session)}
    ${lvlBox(s.levels,s.entry)}
    ${pbBox(s.pullback,s.fib)}
    <div class="ibadges">${badge(s.st_with_trade,'All STs aligned with trade')}${badge(s.trend_match,'With 1H trend')}</div></div>`;
}
function indAiHtml(t){

let trSort={k:'date',dir:-1}, trFilter={asset:'',dir:'',res:''};
function screenTrades(){
  const assets=[...new Set(DATA.trades.map(t=>t.asset))].sort();
  return `<div class="filters">
    <select id="fAsset"><option value="">All instruments</option>${assets.map(a=>`<option ${trFilter.asset===a?'selected':''}>${a}</option>`).join('')}</select>
    <select id="fDir"><option value="">All sides</option><option ${trFilter.dir==='Long'?'selected':''}>Long</option><option ${trFilter.dir==='Short'?'selected':''}>Short</option></select>
    <select id="fRes"><option value="">All results</option><option ${trFilter.res==='Win'?'selected':''}>Win</option><option ${trFilter.res==='Loss'?'selected':''}>Loss</option></select>
    <input id="fSearch" placeholder="Search notes/setup..." value="${trFilter.q||''}">
  </div><div class="panel" style="padding:0"><div class="tablewrap" id="trtable"></div></div>`;
}
function renderTrades(){
  const t=$('#trtable'); if(!t) return;
  let rows=DATA.trades.filter(r=>
    (!trFilter.asset||r.asset===trFilter.asset)&&
    (!trFilter.dir||r.direction===trFilter.dir)&&
    (!trFilter.res||r.winloss===trFilter.res)&&
    (!trFilter.q||(r.notes+r.setup).toLowerCase().includes(trFilter.q.toLowerCase())));
  rows.sort((a,b)=>{let x=a[trSort.k],y=b[trSort.k];
    if(x==null)x=-Infinity;if(y==null)y=-Infinity;
    return (x>y?1:x<y?-1:0)*trSort.dir;});
  const tot=rows.reduce((s,r)=>s+(r.pnl||0),0);
  const h=(k,l)=>`<th data-k="${k}">${l}${trSort.k===k?(trSort.dir>0?' ▲':' ▼'):''}</th>`;
  t.innerHTML=`<table><thead><tr>
    ${h('date','Date')}${h('time','Time')}${h('asset','Symbol')}${h('direction','Side')}
    ${h('entry','Entry')}${h('exit','Exit')}${h('size','Size')}${h('stop','Stop')}${h('target','Target')}
    ${h('rr_realized','RR')}${h('pnl','Net P&L')}${h('setup','Setup')}<th>Chart</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="clickable" onclick="openTrade(${r.id})">
      <td>${r.date}</td><td>${r.time}</td><td>${r.asset}</td>
      <td><span class="badge ${r.direction==='Long'?'b-long':'b-short'}">${r.direction}</span></td>
      <td>${px(r.entry)}</td><td>${px(r.exit)}</td><td>${r.size??''}</td>
      <td>${px(r.stop)}</td><td>${px(r.target)}</td>
      <td>${r.rr_realized??'—'}</td>
      <td class="${cls(r.pnl)}">${money(r.pnl)}</td>
      <td>${r.setup?`<span class="chip ${r.setup_auto?'auto':''}">${r.setup}${r.setup_auto?' ✦':''}</span>`:'—'}</td>
      <td>${r.chart?`<a href="${r.chart}" target="_blank" onclick="event.stopPropagation()">↗</a>`:'—'}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="10" style="text-align:right;color:var(--muted)">Total (${rows.length})</td>
      <td class="${cls(tot)}" style="font-weight:700">${money(tot)}</td><td colspan="2"></td></tr></tfoot>
    </table>`;
  t.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; trSort.dir=(trSort.k===k)?-trSort.dir:1; trSort.k=k; renderTrades();});
}
function initTrades(){
  $('#fAsset').onchange=e=>{trFilter.asset=e.target.value;renderTrades();};
  $('#fDir').onchange=e=>{trFilter.dir=e.target.value;renderTrades();};
  $('#fRes').onchange=e=>{trFilter.res=e.target.value;renderTrades();};
  $('#fSearch').oninput=e=>{trFilter.q=e.target.value;renderTrades();};
  renderTrades();
}

    return `<div class="panel" style="margin-bottom:16px">

  }).join('')||'<div class="empty">No trades.</div>';
}

  const noted=DATA.trades.filter(t=>t.notes&&t.notes!=='Imported from Tradovate');
  const aiHtml=DATA.ai_text?mdToHtml(DATA.ai_text):'';
  return `${aiHtml?`<div class="panel ai" style="margin-bottom:16px"><h3>🤖 Claude Coaching</h3>${aiHtml}</div>`:''}
  <div class="panel"><h3>Trade notes</h3>
    ${noted.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Symbol</th><th>P&L</th><th>Note</th></tr></thead>
      <tbody>${noted.map(t=>`<tr><td>${t.date}</td><td>${t.asset}</td>
      <td class="${cls(t.pnl)}">${money(t.pnl)}</td><td style="white-space:normal">${t.notes}</td></tr>`).join('')}</tbody></table></div>`:
      '<p class="empty">No trade notes yet. Add notes in the <b>Notes</b> column of your Excel journal.</p>'}
  </div>`;
}
function mdToHtml(t){
  const lines=t.split('\n');let h='',inList=false;
  const inline=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;')
     .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  for(let ln of lines){
    if(/^##\s/.test(ln)){if(inList){h+='</ul>';inList=false;}h+='<h3>'+inline(ln.slice(3))+'</h3>';}
    else if(/^\s*[-*]\s/.test(ln)){if(!inList){h+='<ul>';inList=true;}h+='<li>'+inline(ln.replace(/^\s*[-*]\s/,''))+'</li>';}
    else if(ln.trim()===''){if(inList){h+='</ul>';inList=false;}}
    else{if(inList){h+='</ul>';inList=false;}h+='<p>'+inline(ln)+'</p>';}
  }
  if(inList)h+='</ul>';return h;
}

/* ================= NEWS (ForexFactory-style) ================= */
const IMPACTS=[['High','imp-high','#ef4444'],['Medium','imp-med','#f59e0b'],['Low','imp-low','#eab308']];
const IMP_COLOR={High:'#ef4444',Medium:'#f59e0b',Low:'#eab308',Holiday:'#6b7280','Non-Economic':'#6b7280'};
let newsFilter={imp:new Set(['High']), ccy:new Set(['USD'])};
function folderSvg(color){
  return `<svg width="16" height="13" viewBox="0 0 16 13" style="vertical-align:-2px">
    <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3.2c.4 0 .78.16 1.06.44L8 2.5h5.5A1.5 1.5 0 0 1 15 4v6.5A1.5 1.5 0 0 1 13.5 12h-11A1.5 1.5 0 0 1 1 10.5z"
      fill="${color}"/></svg>`;
}
function screenNews(){
  if(!DATA.news_week || !DATA.news_week.length){
    return `<div class="panel"><h3>News & Economic Calendar</h3>
      <div class="news-note">⚠️ The ForexFactory calendar feed didn't load when this
      report was generated (the free feed occasionally rate-limits). Rebuild to
      retry: <code>python -m journal app --open</code></div>
      <p class="muted">Historical major events for your trade days still appear as
      dots on the Dashboard and Calendar pages.</p></div>`;
  }
  const ccys=[...new Set(DATA.news_week.map(e=>e.country))].filter(c=>c&&c!=='All').sort();
  const w=DATA.news_window;
  const impBoxes=IMPACTS.map(([name,cls,col])=>`
    <label class="fopt"><input type="checkbox" data-imp="${name}" ${newsFilter.imp.has(name)?'checked':''}>
      <span class="imp-dot">${folderSvg(col)} ${name} impact</span></label>`).join('');
  const ccyBoxes=ccys.map(c=>`<label class="fopt"><input type="checkbox" data-ccy="${c}" ${newsFilter.ccy.has(c)?'checked':''}> ${c}</label>`).join('');
  return `<div class="news-note">📅 Economic calendar covers ${w.start||'—'} → ${w.end||'—'}
    (the free ForexFactory feed is current-week only, so past trade days have no events here).
    Red = high impact · orange = medium · yellow = low.</div>
  <div class="newsgrid">
    <div class="fpanel">
      <div class="grp"><h4>Expected impact
        <span class="flink" data-all="imp">all</span><span class="flink" data-none="imp">none</span></h4>${impBoxes}</div>
      <div class="grp"><h4>Currencies
        <span class="flink" data-all="ccy">all</span><span class="flink" data-none="ccy">none</span></h4>${ccyBoxes}</div>
    </div>
    <div class="panel" style="padding:0"><div class="tablewrap" id="newsTable"></div></div>
  </div>`;
}
function renderNews(){
  const t=$('#newsTable'); if(!t) return;
  const evs=DATA.news_week.filter(e=>newsFilter.imp.has(e.impact)&&newsFilter.ccy.has(e.country));
  if(!evs.length){t.innerHTML='<div class="empty">No events match the selected filters.</div>';return;}
  const byDate={}; evs.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  let rows='';
  Object.keys(byDate).sort().forEach(d=>{
    const dn=new Date(d+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});
    rows+=`<tr class="news-date"><td colspan="6">${dn}</td></tr>`;
    byDate[d].forEach(e=>{
      const col=IMP_COLOR[e.impact]||'#6b7280';
      rows+=`<tr><td>${e.time||'—'}</td><td><b>${e.country}</b></td>
        <td>${folderSvg(col)} <span class="imp-${e.impact==='High'?'high':e.impact==='Medium'?'med':'low'}">${e.impact}</span></td>
        <td style="white-space:normal">${e.title}</td>
        <td>${e.forecast||'—'}</td><td>${e.previous||'—'}</td></tr>`;
    });
  });
  t.innerHTML=`<table><thead><tr><th>Time</th><th>Ccy</th><th>Impact</th>
    <th>Event</th><th>Forecast</th><th>Previous</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function initNews(){
  const scr=$('#screen');
  scr.querySelectorAll('input[data-imp]').forEach(cb=>cb.onchange=()=>{
    cb.checked?newsFilter.imp.add(cb.dataset.imp):newsFilter.imp.delete(cb.dataset.imp);renderNews();});
  scr.querySelectorAll('input[data-ccy]').forEach(cb=>cb.onchange=()=>{
    cb.checked?newsFilter.ccy.add(cb.dataset.ccy):newsFilter.ccy.delete(cb.dataset.ccy);renderNews();});
  scr.querySelectorAll('[data-all]').forEach(a=>a.onclick=()=>{
    const k=a.dataset.all; if(k==='imp')newsFilter.imp=new Set(IMPACTS.map(x=>x[0]));
    else newsFilter.ccy=new Set([...new Set(DATA.news_week.map(e=>e.country))].filter(c=>c&&c!=='All'));
    nav('news');});
  scr.querySelectorAll('[data-none]').forEach(a=>a.onclick=()=>{
    if(a.dataset.none==='imp')newsFilter.imp=new Set(); else newsFilter.ccy=new Set(); nav('news');});
  renderNews();
}

/* ================= RULES ================= */
function renderRuleList(type, arr){
  if(!arr.length) return '<div class="mono">No rules yet.</div>';
  return arr.map((text,i)=>{
    const enc=encodeURIComponent(text);
    const done=localStorage.getItem('rulechk:'+enc)==='1';
    return `<div class="rule ${type} ${done?'done':''}">
      <input type="checkbox" data-key="${enc}" ${done?'checked':''}>
      <span class="rtext">${esc(text)}</span>
      ${SERVER?`<span class="del" data-type="${type}" data-i="${i}" title="Delete rule">✕</span>`:''}
    </div>`;
  }).join('');
}
function screenRules(){
  const R=DATA.rules||{hard:[],other:[]};
  const sec=(type,title,note)=>`
    <div class="panel">
      <div class="rules-hdr"><h2>${title}</h2><span class="cnt">${R[type].length} rules</span></div>
      <div class="mono" style="margin:0 0 12px">${note}</div>
      <div id="rl_${type}">${renderRuleList(type,R[type])}</div>
      ${SERVER?`<div class="rules-add">
        <input id="add_${type}" placeholder="Add a ${type==='hard'?'hard':'flexible'} rule…"
               onkeydown="if(event.key==='Enter')addRule('${type}')">
        <button onclick="addRule('${type}')">Add</button></div>`:''}
    </div>`;
  return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <span class="mono">Tick rules as you follow them today — your checks are saved in this browser.</span>
      <button class="pill" style="cursor:pointer;margin-left:auto" onclick="resetRuleChecks()">Reset checklist</button></div>
    ${sec('hard','🔒 Hard Rules','Must not be broken.')}
    ${sec('other','⚑ Other Rules','Judgment calls — can be overridden with good reason.')}
    ${SERVER?'':'<div class="mono">Run <code>python -m journal serve</code> (tag.bat) to add or remove rules.</div>'}`;
}
function initRules(){
  document.querySelectorAll('#screen .rule input[type=checkbox]').forEach(cb=>{
    cb.onchange=()=>{
      localStorage.setItem('rulechk:'+cb.dataset.key, cb.checked?'1':'0');
      cb.closest('.rule').classList.toggle('done',cb.checked);
    };
  });
  document.querySelectorAll('#screen .rule .del').forEach(d=>{
    d.onclick=()=>delRule(d.dataset.type, +d.dataset.i);
  });
}
function addRule(type){
  const inp=$('#add_'+type); const v=(inp.value||'').trim(); if(!v) return;
  DATA.rules[type]=DATA.rules[type]||[]; DATA.rules[type].push(v); saveRules();
}
function delRule(type,i){ DATA.rules[type].splice(i,1); saveRules(); }
function saveRules(){
  if(!SERVER){ alert('Run tag.bat (python -m journal serve) to add/remove rules.'); return; }
  fetch('/api/save-rules',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({hard:DATA.rules.hard||[],other:DATA.rules.other||[]})})
    .then(r=>r.json()).then(res=>{ if(!res.ok) alert('Save failed: '+(res.error||'unknown')); refreshScreen(); })
    .catch(e=>{ alert('Save failed: '+e); refreshScreen(); });
}
function resetRuleChecks(){
  Object.keys(localStorage).forEach(k=>{ if(k.indexOf('rulechk:')===0) localStorage.removeItem(k); });
  refreshScreen();
}

/* ================= ROUTER ================= */
const ROUTES={
  dashboard:{title:'Dashboard',render:screenDashboard,init:initDashboard},
  journal:{title:'Daily Journal',render:screenJournal},
  calendar:{title:'Calendar',render:screenCalendar,init:initCalendar},
  news:{title:'News & Economic Calendar',render:screenNews,init:initNews},
  trades:{title:'Trades',render:screenTrades,init:initTrades},
  notebook:{title:'AI Analysis and Coaching',render:screenNotebook},
  rules:{title:'Trading Rules',render:screenRules,init:initRules},
  reports:{title:'Reports',render:screenReports,init:initReports},
  playbooks:{title:'Playbooks',render:screenPlaybooks},
  progress:{title:'Progress Tracker',render:screenProgress,init:initProgress},
};
let ROUTE='dashboard';
function nav(route){
  const r=ROUTES[route]||ROUTES.dashboard;
  ROUTE=ROUTES[route]?route:'dashboard';
  clearCharts();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.route===route));
  $('#title').textContent=r.title;
  $('#screen').innerHTML=r.render();
  if(r.init) r.init();
  location.hash=route;
}
// Re-render the current screen in place (used after saving tags) without
// touching the open trade popup, so tables/aggregates update instantly.
function refreshScreen(){
  const r=ROUTES[ROUTE]||ROUTES.dashboard;
  clearCharts();
  $('#screen').innerHTML=r.render();
  if(r.init) r.init();
}
document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>nav(a.dataset.route));
$('#rangepill').textContent='📅 '+DATA.date_range;
nav((location.hash||'#dashboard').slice(1));
</script>
